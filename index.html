<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05080f" />
<meta name="description" content="Christmas Tree v17.6 — 一棵会旋转的星空圣诞树" />
<title>Christmas Tree · v17.6</title>
<style>
  :root{
    --gold:#f3cd8d;
    --gold-dim:#a98a58;
    --paper:#f7eddd;
    --ink:#05080f;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;margin:0;padding:0;
    background:var(--ink);
    overflow:hidden;
  }
  body{
    font-family:"Optima","Avenir Next","Songti SC","Noto Serif SC",serif;
    color:var(--paper);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  #scene{
    position:fixed;inset:0;
    width:100%;height:100%;
    display:block;
    cursor:grab;
    touch-action:none;
  }
  #scene.is-dragging{cursor:grabbing;}

  .vignette{
    position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(130% 95% at 50% 42%, rgba(0,0,0,0) 38%, rgba(0,0,0,.42) 72%, rgba(0,0,0,.78) 100%);
  }
  .grain{
    position:fixed;inset:-20%;pointer-events:none;opacity:.28;mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='140' height='140' filter='n' opacity='.55'/></svg>");
  }

  .brand{
    position:fixed;
    top:clamp(20px,4.2vw,52px);
    left:clamp(20px,4.2vw,58px);
    pointer-events:none;
    z-index:3;
  }
  .brand .eyebrow{
    font-size:10.5px;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--gold-dim);
  }
  .brand .name{
    margin-top:8px;
    font-size:13px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:rgba(247,237,221,.86);
  }
  .brand .ver{
    margin-top:6px;
    display:inline-flex;align-items:center;gap:8px;
    font-size:11px;letter-spacing:.16em;
    color:rgba(169,138,88,.9);
  }
  .brand .ver::before{
    content:"";display:block;width:22px;height:1px;
    background:linear-gradient(90deg,rgba(243,205,141,.8),rgba(243,205,141,0));
  }

  .title{
    position:fixed;
    left:50%;
    bottom:clamp(56px,9vh,110px);
    transform:translateX(-50%);
    text-align:center;
    pointer-events:none;
    z-index:3;
    width:min(92vw,900px);
    opacity:0;
    animation:riseIn 1.6s cubic-bezier(.16,.84,.24,1) .5s forwards;
  }
  .title h1{
    margin:0;
    font-weight:400;
    font-size:clamp(20px,3.1vw,44px);
    letter-spacing:.34em;
    text-indent:.34em;
    background:linear-gradient(180deg,#fff6e6 0%,#f3cd8d 52%,#b98d4c 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(243,205,141,.35));
    white-space:nowrap;
  }
  .title .sub{
    margin-top:12px;
    font-size:clamp(9px,1vw,11.5px);
    letter-spacing:.46em;
    text-indent:.46em;
    color:rgba(247,237,221,.5);
  }
  .title .line{
    width:46px;height:1px;margin:16px auto 0;
    background:linear-gradient(90deg,rgba(243,205,141,0),rgba(243,205,141,.75),rgba(243,205,141,0));
  }

  .hint{
    position:fixed;
    right:clamp(20px,4.2vw,58px);
    bottom:clamp(20px,4.2vw,42px);
    font-size:10px;
    letter-spacing:.24em;
    color:rgba(247,237,221,.34);
    pointer-events:none;z-index:3;
    text-align:right;line-height:1.9;
  }
  .hint span{display:block;}

  @keyframes riseIn{
    from{opacity:0;transform:translate(-50%,18px);}
    to{opacity:1;transform:translate(-50%,0);}
  }
  @media (max-width:640px){
    .brand .name{display:none;}
    .title h1{letter-spacing:.2em;font-size:clamp(18px,5.6vw,26px);}
    .title{bottom:clamp(46px,8vh,80px);}
    .hint{display:none;}
  }
  @media (prefers-reduced-motion:reduce){
    .title{animation:none;opacity:1;}
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="旋转的星空圣诞树"></canvas>
<div class="vignette"></div>
<div class="grain"></div>

<header class="brand">
  <div class="eyebrow">Studio Winter</div>
  <div class="name">Christmas Tree</div>
  <div class="ver">v17.6</div>
</header>

<div class="title">
  <h1>MERRY CHRISTMAS</h1>
  <div class="line"></div>
  <div class="sub">愿灯火与你，都被温柔以待 · 2026</div>
</div>

<div class="hint">
  <span>拖动 · 旋转</span>
  <span>滚轮 · 远近</span>
</div>

<script>
(() => {
  'use strict';

  const cvs = document.getElementById('scene');
  const ctx = cvs.getContext('2d', { alpha: false });
  const TAU = Math.PI * 2;

  // 调试：?debug=1 时把视口信息写到标签标题
  if (location.search.indexOf('debug') > -1) {
    const dbg = () => {
      document.title = `${innerWidth}x${innerHeight} dpr${devicePixelRatio} css${cvs.clientWidth}x${cvs.clientHeight}`;
    };
    dbg();
    addEventListener('resize', dbg);
  }

  /* ------------------------------------------------------------
     基础尺寸 / 设备像素比
  ------------------------------------------------------------ */
  let W = 0, H = 0, DPR = 1;
  let bg = null;                 // 背景缓存画布
  let bgCtx = null;

  const CFG = {
    treeH: 7.4,
    treeR: 2.62,
    camDist: 12.2,
    camDistTarget: 12.2,
    focalRatio: 0.86,
    centerY: 0.525,
    spin: 0.00055,
    yaw: 0.62,
  };

  /* ------------------------------------------------------------
     光点贴图（预渲染，避免逐帧 shadowBlur）
  ------------------------------------------------------------ */
  function makeGlow(r, g, b) {
    const S = 64;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const x = c.getContext('2d');
    const grd = x.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    grd.addColorStop(0.00, `rgba(${r},${g},${b},1)`);
    grd.addColorStop(0.16, `rgba(${r},${g},${b},.78)`);
    grd.addColorStop(0.42, `rgba(${r},${g},${b},.28)`);
    grd.addColorStop(0.72, `rgba(${r},${g},${b},.07)`);
    grd.addColorStop(1.00, `rgba(${r},${g},${b},0)`);
    x.fillStyle = grd;
    x.fillRect(0, 0, S, S);
    return c;
  }

  const SPR = {
    leafDeep:   makeGlow(10, 48, 36),
    leafMid:    makeGlow(22, 98, 66),
    leafBright: makeGlow(52, 158, 106),
    leafTip:    makeGlow(136, 232, 172),
    warm:       makeGlow(255, 216, 154),
    gold:       makeGlow(255, 190, 104),
    ice:        makeGlow(158, 216, 255),
    red:        makeGlow(255, 96, 78),
    white:      makeGlow(255, 244, 224),
    star:       makeGlow(255, 238, 196),
    snow:       makeGlow(226, 236, 255),
    ground:     makeGlow(243, 196, 128),
  };

  /* ------------------------------------------------------------
     树的几何
  ------------------------------------------------------------ */
  const HALF_H = CFG.treeH / 2;
  const Y_BOTTOM = -HALF_H;
  const Y_TOP = HALF_H;

  // t: 0 = 树底, 1 = 树尖
  function radiusAt(t) {
    return CFG.treeR * Math.pow(1 - t, 0.88) + 0.05;
  }

  const foliage = [];
  const bulbs = [];
  const ornaments = [];
  const starsBg = [];
  const snow = [];

  function buildTree() {
    foliage.length = 0;
    bulbs.length = 0;
    ornaments.length = 0;

    /* ---- 松针 / 针叶体积 ---- */
    const N = 6800;
    for (let i = 0; i < N; i++) {
      const t = Math.pow(Math.random(), 0.62);          // 底部更密
      const y = Y_BOTTOM + t * CFG.treeH;
      const theta = Math.random() * TAU;

      // 分层枝丫：让轮廓出现真实冷杉的层叠起伏
      const tier = 1 + 0.085 * Math.sin(t * Math.PI * 16 + theta * 2);
      const base = radiusAt(t) * tier;

      // 体积填充：多数贴近表面，少量在内部
      const fill = 0.34 + 0.66 * Math.sqrt(Math.random());
      // 树枝外沿的“针尖”
      const tip = Math.random() < 0.09 ? 1.0 : fill;
      const rad = base * tip;

      const px = Math.cos(theta) * rad;
      const pz = Math.sin(theta) * rad;
      const py = y + (Math.random() - 0.5) * 0.13;

      let sprite, size, alpha;
      if (tip > 0.94) {
        sprite = Math.random() < 0.5 ? SPR.leafTip : SPR.leafBright;
        size = 0.052 + Math.random() * 0.034;
        alpha = 0.30 + Math.random() * 0.26;
      } else if (fill > 0.7) {
        sprite = Math.random() < 0.3 ? SPR.leafBright : SPR.leafMid;
        size = 0.058 + Math.random() * 0.05;
        alpha = 0.20 + Math.random() * 0.24;
      } else {
        sprite = Math.random() < 0.35 ? SPR.leafMid : SPR.leafDeep;
        size = 0.055 + Math.random() * 0.045;
        alpha = 0.13 + Math.random() * 0.18;
      }

      foliage.push({ x: px, y: py, z: pz, s: size, a: alpha, img: sprite });
    }

    /* ---- 螺旋灯带 ---- */
    const L = 460;
    for (let i = 0; i < L; i++) {
      const t = i / (L - 1);
      const theta = t * TAU * 8.6 + 0.35;
      const y = Y_BOTTOM + t * (CFG.treeH - 0.25);
      const r = radiusAt(t) * 1.055 + 0.02;
      const rnd = Math.random();
      const img = rnd < 0.62 ? SPR.warm : (rnd < 0.9 ? SPR.gold : SPR.ice);
      bulbs.push({
        x: Math.cos(theta) * r,
        y,
        z: Math.sin(theta) * r,
        s: 0.026 + Math.random() * 0.016,
        a: 0.85,
        img,
        phase: Math.random() * TAU,
        tw: 0.5 + Math.random() * 0.8,
      });
    }

    /* ---- 挂饰球 ---- */
    const PALETTE = [SPR.gold, SPR.red, SPR.ice, SPR.white, SPR.gold, SPR.red];
    const M = 78;
    for (let i = 0; i < M; i++) {
      const t = 0.04 + Math.random() * 0.85;
      const theta = Math.random() * TAU;
      const r = radiusAt(t) * (0.9 + Math.random() * 0.08);
      const y = Y_BOTTOM + t * CFG.treeH;
      ornaments.push({
        x: Math.cos(theta) * r,
        y,
        z: Math.sin(theta) * r,
        s: 0.085 + Math.random() * 0.05,
        a: 0.95,
        img: PALETTE[(Math.random() * PALETTE.length) | 0],
        phase: Math.random() * TAU,
      });
    }
  }

  function buildStars() {
    starsBg.length = 0;
    const n = 120;
    for (let i = 0; i < n; i++) {
      starsBg.push({
        x: Math.random(),
        y: Math.random() * 0.75,
        r: 0.3 + Math.random() * 1.1,
        a: 0.18 + Math.random() * 0.5,
        ph: Math.random() * TAU,
        sp: 0.4 + Math.random() * 0.9,
      });
    }
  }

  function buildSnow() {
    snow.length = 0;
    const n = Math.min(340, Math.max(120, Math.round(W * 0.32)));
    for (let i = 0; i < n; i++) {
      const z = Math.random();                          // 0 远 → 1 近
      snow.push({
        x: Math.random() * W,
        y: Math.random() * H,
        z,
        r: 0.6 + z * 3.0,
        vy: 0.25 + z * 1.35,
        phase: Math.random() * TAU,
        sway: 0.4 + Math.random() * 1.3,
        a: 0.10 + z * 0.42,
      });
    }
  }

  /* ------------------------------------------------------------
     背景（缓存一次）
  ------------------------------------------------------------ */
  function paintBackground() {
    bg = document.createElement('canvas');
    bg.width = Math.max(1, Math.floor(W * DPR));
    bg.height = Math.max(1, Math.floor(H * DPR));
    bgCtx = bg.getContext('2d');
    bgCtx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const g = bgCtx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0.00, '#04060c');
    g.addColorStop(0.38, '#071120');
    g.addColorStop(0.72, '#0a1524');
    g.addColorStop(1.00, '#050a13');
    bgCtx.fillStyle = g;
    bgCtx.fillRect(0, 0, W, H);

    // 冷调天光
    const cool = bgCtx.createRadialGradient(W * 0.5, H * 0.18, 0, W * 0.5, H * 0.18, Math.max(W, H) * 0.62);
    cool.addColorStop(0, 'rgba(38,78,140,.30)');
    cool.addColorStop(0.45, 'rgba(24,52,96,.14)');
    cool.addColorStop(1, 'rgba(8,18,34,0)');
    bgCtx.fillStyle = cool;
    bgCtx.fillRect(0, 0, W, H);

    // 地面暖光
    const warm = bgCtx.createRadialGradient(W * 0.5, H * 0.88, 0, W * 0.5, H * 0.88, Math.max(W, H) * 0.45);
    warm.addColorStop(0, 'rgba(120,72,24,.26)');
    warm.addColorStop(0.5, 'rgba(78,46,16,.10)');
    warm.addColorStop(1, 'rgba(20,12,4,0)');
    bgCtx.fillStyle = warm;
    bgCtx.fillRect(0, 0, W, H);

    // 树后面的柔光晕
    const halo = bgCtx.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, Math.min(W, H) * 0.55);
    halo.addColorStop(0, 'rgba(46,102,96,.16)');
    halo.addColorStop(0.55, 'rgba(22,56,64,.06)');
    halo.addColorStop(1, 'rgba(0,0,0,0)');
    bgCtx.fillStyle = halo;
    bgCtx.fillRect(0, 0, W, H);
  }

  /* ------------------------------------------------------------
     交互
  ------------------------------------------------------------ */
  const input = { dragging: false, lastX: 0, vel: 0, idle: 0 };

  cvs.addEventListener('pointerdown', (e) => {
    input.dragging = true;
    input.lastX = e.clientX;
    input.vel = 0;
    input.idle = 0;
    cvs.classList.add('is-dragging');
    cvs.setPointerCapture(e.pointerId);
  });

  cvs.addEventListener('pointermove', (e) => {
    if (!input.dragging) return;
    const dx = e.clientX - input.lastX;
    input.lastX = e.clientX;
    const step = dx * 0.0062;
    CFG.yaw += step;
    input.vel = step;
    input.idle = 0;
  });

  const endDrag = (e) => {
    if (!input.dragging) return;
    input.dragging = false;
    cvs.classList.remove('is-dragging');
    if (e && e.pointerId !== undefined && cvs.hasPointerCapture(e.pointerId)) {
      cvs.releasePointerCapture(e.pointerId);
    }
  };
  cvs.addEventListener('pointerup', endDrag);
  cvs.addEventListener('pointercancel', endDrag);

  cvs.addEventListener('wheel', (e) => {
    e.preventDefault();
    CFG.camDistTarget = Math.min(16.5, Math.max(9.2, CFG.camDistTarget + e.deltaY * 0.006));
  }, { passive: false });

  /* ------------------------------------------------------------
     尺寸
  ------------------------------------------------------------ */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cvs.width = Math.floor(W * DPR);
    cvs.height = Math.floor(H * DPR);
    cvs.style.width = W + 'px';
    cvs.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    paintBackground();
    buildStars();
    buildSnow();
  }

  /* ------------------------------------------------------------
     绘制
  ------------------------------------------------------------ */
  const proj = { k: 0 };

  function frame(now) {
    const t = now || 0;
    const dt = Math.min(48, t - (frame.prev || t) || 16);
    frame.prev = t;

    // 保险：浏览器窗口尺寸变化时自动重排（部分嵌入式窗口不派发 resize 事件）
    if (window.innerWidth !== W || window.innerHeight !== H) {
      const oldYaw = CFG.yaw;
      resize();
      CFG.yaw = oldYaw;
    }

    // 惯性 + 自动旋转
    if (!input.dragging) {
      input.idle += dt;
      if (Math.abs(input.vel) > 0.0002) {
        CFG.yaw += input.vel;
        input.vel *= 0.94;
      } else if (input.idle > 900) {
        CFG.yaw += CFG.spin * dt;
      }
    }
    CFG.camDist += (CFG.camDistTarget - CFG.camDist) * Math.min(1, dt * 0.006);

    const cosY = Math.cos(CFG.yaw);
    const sinY = Math.sin(CFG.yaw);
    const f = Math.min(H * CFG.focalRatio, W * 1.18);
    const cx = W * 0.5;
    const bob = Math.sin(t * 0.00042) * H * 0.006;
    const cy = H * CFG.centerY + bob;

    // 背景
    if (bg) ctx.drawImage(bg, 0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';

    // 星空
    for (let i = 0; i < starsBg.length; i++) {
      const s = starsBg[i];
      const tw = 0.55 + 0.45 * Math.sin(t * 0.001 * s.sp + s.ph);
      ctx.globalAlpha = s.a * tw * 0.8;
      ctx.drawImage(SPR.white, s.x * W - s.r * 3, s.y * H - s.r * 3, s.r * 6, s.r * 6);
    }

    // 地面反光
    const groundY = cy - Y_BOTTOM * (f / CFG.camDist);
    ctx.globalAlpha = 0.5;
    const gw = Math.max(220, W * 0.5);
    ctx.drawImage(SPR.ground, cx - gw / 2, groundY - gw * 0.16, gw, gw * 0.34);

    // 树的投影（暗）
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = 'rgba(2,4,8,1)';
    ctx.beginPath();
    ctx.ellipse(cx, groundY + 2, Math.max(52, W * 0.062), Math.max(8, W * 0.012), 0, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = 'lighter';

    const scaleK = f / CFG.camDist;

    /* ---- 针叶 ---- */
    for (let i = 0; i < foliage.length; i++) {
      const p = foliage[i];
      const xr = p.x * cosY - p.z * sinY;
      const zr = p.x * sinY + p.z * cosY;
      const d = zr + CFG.camDist;
      if (d < 2) continue;
      const k = f / d;
      const sx = cx + xr * k;
      const sy = cy - p.y * k;
      if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) continue;

      const depth = (zr + CFG.treeR) / (CFG.treeR * 2);      // 0 后 → 1 前
      const dim = 0.42 + 0.58 * (depth * depth * (3 - 2 * depth));
      const size = p.s * k * 2.5;
      ctx.globalAlpha = p.a * dim;
      ctx.drawImage(p.img, sx - size / 2, sy - size / 2, size, size);
    }

    /* ---- 灯带 ---- */
    for (let i = 0; i < bulbs.length; i++) {
      const p = bulbs[i];
      const xr = p.x * cosY - p.z * sinY;
      const zr = p.x * sinY + p.z * cosY;
      const d = zr + CFG.camDist;
      if (d < 2) continue;
      const k = f / d;
      const sx = cx + xr * k;
      const sy = cy - p.y * k;

      const depth = (zr + CFG.treeR) / (CFG.treeR * 2);
      const twinkle = 0.62 + 0.38 * Math.sin(t * 0.0022 * p.tw + p.phase);
      const core = p.s * k * 3.4;
      ctx.globalAlpha = p.a * (0.35 + 0.65 * depth) * twinkle;
      ctx.drawImage(p.img, sx - core / 2, sy - core / 2, core, core);

      // 高光芯
      ctx.globalAlpha = Math.min(1, twinkle * 0.85);
      ctx.drawImage(SPR.white, sx - core * 0.16, sy - core * 0.16, core * 0.32, core * 0.32);
    }

    /* ---- 挂饰 ---- */
    for (let i = 0; i < ornaments.length; i++) {
      const p = ornaments[i];
      const xr = p.x * cosY - p.z * sinY;
      const zr = p.x * sinY + p.z * cosY;
      const d = zr + CFG.camDist;
      if (d < 2) continue;
      const k = f / d;
      const sx = cx + xr * k;
      const sy = cy - p.y * k;

      const depth = (zr + CFG.treeR) / (CFG.treeR * 2);
      const size = p.s * k * (1.9 + 0.9 * depth);
      ctx.globalAlpha = p.a * (0.3 + 0.7 * depth);
      ctx.drawImage(p.img, sx - size / 2, sy - size / 2, size, size);

      // 球面上的小高光
      ctx.globalAlpha = 0.55 * depth;
      const hl = size * 0.2;
      ctx.drawImage(SPR.white, sx - size * 0.26, sy - size * 0.3, hl, hl);
    }

    /* ---- 树顶星 ---- */
    {
      const d = CFG.camDist - 0.3;
      const k = f / d;
      const sx = cx;
      const sy = cy - (Y_TOP + 0.62) * k;
      const pulse = 0.78 + 0.22 * Math.sin(t * 0.0016);
      const R = 0.5 * k * 0.42;

      // 光晕
      ctx.globalAlpha = 0.62 * pulse;
      const halo = R * 6.2;
      ctx.drawImage(SPR.star, sx - halo / 2, sy - halo / 2, halo, halo);
      ctx.globalAlpha = 0.9;
      const halo2 = R * 2.6;
      ctx.drawImage(SPR.star, sx - halo2 / 2, sy - halo2 / 2, halo2, halo2);

      // 星形本体
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(Math.sin(t * 0.0006) * 0.08);
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
      grad.addColorStop(0, `rgba(255,255,246,${0.98 * pulse})`);
      grad.addColorStop(0.55, `rgba(255,238,196,${0.92 * pulse})`);
      grad.addColorStop(1, 'rgba(255,206,132,.25)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const rr = i % 2 === 0 ? R : R * 0.44;
        const a = -Math.PI / 2 + i * Math.PI / 5;
        const x = Math.cos(a) * rr;
        const y = Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();

      // 长光芒
      const rays = 6;
      for (let i = 0; i < rays; i++) {
        const a = i * Math.PI / 3 + Math.sin(t * 0.0009) * 0.12;
        ctx.save();
        ctx.rotate(a);
        const len = R * (i % 2 ? 2.6 : 4.2) * (0.85 + 0.15 * pulse);
        const lg = ctx.createLinearGradient(0, 0, 0, -len);
        lg.addColorStop(0, `rgba(255,240,200,${0.55 * pulse})`);
        lg.addColorStop(1, 'rgba(255,220,150,0)');
        ctx.fillStyle = lg;
        ctx.beginPath();
        ctx.moveTo(-R * 0.09, 0);
        ctx.lineTo(0, -len);
        ctx.lineTo(R * 0.09, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      ctx.restore();
    }

    /* ---- 雪 ---- */
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < snow.length; i++) {
      const s = snow[i];
      s.y += s.vy * (dt / 16);
      s.x += Math.sin(t * 0.0008 + s.phase) * s.sway * (dt / 16) * 0.35;
      if (s.y > H + 20) { s.y = -20; s.x = Math.random() * W; }
      if (s.x < -20) s.x = W + 10;
      if (s.x > W + 20) s.x = -10;

      const size = s.r * (2.2 + s.z * 2.2);
      ctx.globalAlpha = s.a;
      ctx.drawImage(SPR.snow, s.x - size / 2, s.y - size / 2, size, size);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(frame);
  }

  /* ------------------------------------------------------------
     启动
  ------------------------------------------------------------ */
  buildTree();
  resize();
  window.addEventListener('resize', () => {
    const oldYaw = CFG.yaw;
    resize();
    CFG.yaw = oldYaw;
  });

  // 首帧淡入
  cvs.style.opacity = '0';
  requestAnimationFrame((ts) => {
    cvs.style.transition = 'opacity 1.2s ease';
    cvs.style.opacity = '1';
    frame.prev = ts;
    frame(ts);
  });
})();
</script>
</body>
</html>
